<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inkwell — Notebooks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f1ebdf;--panel:#fbf8f2;--ink:#1f2430;--mute:#8a836f;--line:#e2dacb;--acc:#8a5a2b;--accbg:#efe3cf;--sh:0 12px 40px rgba(60,40,10,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f11;--panel:#17181c;--ink:#ece8df;--mute:#8b877d;--line:#26272c;--acc:#d9ab6b;--accbg:#2a2418;--sh:0 12px 40px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg:#0e0f11;--panel:#17181c;--ink:#ece8df;--mute:#8b877d;--line:#26272c;--acc:#d9ab6b;--accbg:#2a2418;--sh:0 12px 40px rgba(0,0,0,.55)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;transition:background .15s,transform .1s}
button:hover{background:var(--accbg)}button:active{transform:scale(.96)}
#app{display:grid;grid-template-columns:284px 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px 14px;gap:12px;min-height:0}
.brand{font:600 26px Fraunces,Georgia,serif;letter-spacing:-.5px;padding:0 6px}.brand i{color:var(--acc);font-style:normal}
#q{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);outline:0}
#q:focus,#title:focus{border-color:var(--acc)}
.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}.pri:hover{background:var(--acc);border-color:var(--acc);color:#fff}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px}
.it{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:background .15s}
.it:hover{background:var(--bg)}.it.on{background:var(--accbg);border-color:var(--line)}
.cv{width:30px;height:38px;border-radius:3px 7px 7px 3px;flex:none;box-shadow:inset 4px 0 0 rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.18)}
.it b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}.it small{color:var(--mute)}
main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
#head{display:flex;align-items:center;gap:10px;padding:14px 22px 6px}
#menu{display:none}
#title{flex:1;min-width:0;border:0;border-bottom:1px solid transparent;background:none;outline:0;font:600 28px Fraunces,Georgia,serif;letter-spacing:-.5px}
#st{color:var(--mute);font-size:12px;white-space:nowrap}
#pages{display:flex;gap:6px;align-items:center;padding:4px 22px 8px;overflow-x:auto;scrollbar-width:none}
#pages button{padding:5px 12px;border-radius:999px;white-space:nowrap}
#pages button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#pages select{border:1px solid var(--line);border-radius:999px;background:none;padding:5px 8px}
#tools{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--sh);border-radius:20px;padding:6px 10px;z-index:3;max-width:calc(100% - 20px)}
#tools button{border:0;padding:7px 9px;border-radius:10px}
#tools button.on{background:var(--accbg);color:var(--acc);font-weight:600}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
#cols{display:flex;gap:6px;align-items:center}
.dot{width:22px!important;height:22px;padding:0!important;border-radius:50%!important;border:2px solid var(--panel)!important}
.dot.on{box-shadow:0 0 0 2px var(--acc)}
input[type=range]{width:70px;accent-color:var(--acc)}
#stage{flex:1;overflow:auto;min-height:0;padding:4px 16px 0;scroll-behavior:auto}
#sheet{margin:0 auto 90px;position:relative;border-radius:8px;box-shadow:var(--sh);background:#fdfbf6}
#cv{position:sticky;top:0;display:block;border-radius:8px;cursor:crosshair;touch-action:none}
#tx{display:block;margin:0 auto 90px;width:min(100%,780px);min-height:75vh;border:0;outline:0;resize:none;background:#fdfbf6;color:#1f2430;border-radius:8px;box-shadow:var(--sh);padding:40px 48px;font:19px/1.75 Fraunces,Georgia,serif}
#empty{margin:18vh auto;text-align:center;color:var(--mute)}#empty h2{font:600 28px Fraunces,serif;color:var(--ink)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw}#toast.s{opacity:1}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--ink);padding:26px;max-width:440px;box-shadow:var(--sh)}
dialog::backdrop{background:rgba(0,0,0,.4)}dialog h3{font:600 22px Fraunces,serif;margin:0 0 8px}dialog p{color:var(--mute);margin:0 0 14px}
dialog input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:12px}
#pop{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh);padding:16px;z-index:4;width:240px;display:flex;flex-direction:column;align-items:center;gap:12px}
#wheel{position:relative;width:196px;height:196px;border-radius:50%;background:radial-gradient(circle closest-side,#fff,rgba(255,255,255,0)),conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);touch-action:none;cursor:crosshair;box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--line)}
#dk{position:absolute;inset:0;border-radius:50%;background:#000;opacity:0;pointer-events:none}
#knob{position:absolute;left:98px;top:98px;width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.35);transform:translate(-50%,-50%);pointer-events:none}
#bri{width:100%}#rec{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:22px}#hex{font:500 12px ui-monospace,monospace;color:var(--mute)}
#tools .rb{background:radial-gradient(circle,var(--cc,#1f2430) 34%,transparent 37%),conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
body{background:radial-gradient(1100px 600px at 78% -12%,color-mix(in srgb,var(--acc) 15%,transparent),transparent),radial-gradient(800px 500px at -8% 112%,color-mix(in srgb,var(--acc) 9%,transparent),transparent),var(--bg)}
aside{background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--panel) 90%,var(--bg)));box-shadow:8px 0 30px rgba(60,40,10,.05)}
.brand{display:flex;align-items:center;gap:10px}.brand:before{content:"";width:20px;height:20px;border-radius:50% 0 50% 50%;transform:rotate(45deg);background:linear-gradient(135deg,var(--acc),#3a2410);box-shadow:0 3px 8px rgba(138,90,43,.4)}
.it{border-radius:14px}.it:hover{transform:translateX(2px)}.it.on{box-shadow:0 6px 18px rgba(60,40,10,.1)}
.cv{box-shadow:inset 4px 0 0 rgba(0,0,0,.22),inset -1px 0 0 rgba(255,255,255,.18),0 4px 10px rgba(0,0,0,.22)}
#head{padding:16px 26px 8px}#sheet{box-shadow:0 1px 2px rgba(60,40,10,.08),0 24px 60px rgba(60,40,10,.2)}
#tools{gap:2px;padding:8px 10px;border-radius:26px;bottom:22px}
#tools button{width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:12px}
#tools button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tools button.on{background:var(--ink);color:var(--bg)}
#tools button.dot{width:22px;height:22px}#tools #snap,#tools #po,#tools #clr{width:auto;padding:0 12px;font-size:12px}
#pages{padding:4px 26px 12px;gap:10px}
.pg{position:relative;flex:none;border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid var(--line);background:#fdfbf6;transition:transform .15s,box-shadow .15s}
.pg canvas{display:block;width:40px;height:54px}.pg span{position:absolute;bottom:2px;right:3px;font-size:10px;font-weight:600;color:#555;background:rgba(255,255,255,.8);border-radius:6px;padding:0 4px}
.pg.on{border-color:var(--acc);box-shadow:0 6px 16px rgba(138,90,43,.32);transform:translateY(-2px)}.pg.ov{outline:2px dashed var(--acc)}.pg.dg{opacity:.4}
.pa{display:flex;gap:6px;align-items:center;margin-left:auto;padding-left:12px}.pa button,.pa select{border-radius:10px!important;padding:6px 10px!important;background:none}
#selbar{position:absolute;top:118px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh);border-radius:14px;padding:5px;z-index:3;animation:pin .18s}
@keyframes pin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}#pop{animation:pin .18s}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid transparent;background-clip:content-box}
#selbar{top:150px}
#ied{position:absolute;right:22px;top:150px;width:236px;display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh);border-radius:18px;padding:14px;z-index:3;animation:fin .18s}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ir{display:flex;gap:6px;flex-wrap:wrap}.ir button,#idl{padding:6px 10px;border-radius:10px;font-size:12px}#ibw.on{background:var(--ink);color:var(--bg)}
#ied label{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);gap:8px}#ied input[type=range]{width:118px}
@media (max-width:760px){#app{grid-template-columns:1fr}aside{position:fixed;inset:0 18% 0 0;z-index:5;transform:translateX(-101%);transition:transform .25s;box-shadow:var(--sh)}aside.open{transform:none}#menu{display:block}#head{padding:10px 12px 4px}#title{font-size:21px}#pages{padding:4px 12px}#tx{padding:24px}}
</style>
</head>
<body>
<div id="app">
<aside id="side">
  <div class="brand">Ink<i>well</i></div>
  <input id="q" placeholder="Search notebooks">
  <button class="pri" id="nNb">＋ New notebook</button>
  <div id="list"></div>
  <button id="drv">Connect Google Drive</button>
</aside>
<main>
  <div id="head"><button id="menu">☰</button><span class="cv" id="cover" style="width:22px;height:28px;cursor:pointer" title="Change cover"></span><input id="title" placeholder="Untitled notebook"><span id="st">Saved</span><button id="thm" title="Light / dark">◐</button><button id="exp">Export page (PDF)</button><button id="expnb">Export notebook (PDF)</button><button id="del">Delete</button></div>
  <div id="pages"></div>
  <div id="tools">
    <button data-t="sel">Select</button><button data-t="pen" class="on">Pen</button><button data-t="hi">Mark</button><button data-t="er">Erase</button><button data-t="ln">Line</button><button data-t="rc">Box</button><button data-t="el">Oval</button><button data-t="lasso">Lasso</button><button data-t="hand">Move</button><button data-t="space">Insert space</button><button id="ib">Image</button><input type="file" id="fi" accept="image/*" hidden>
    <span class="sep"></span><span id="cols"></span><button class="dot rb" id="wb" title="Colour wheel"></button><input type="range" id="size" min="1" max="14" value="3" title="Pen size"><input type="range" id="smo" min="0" max="10" value="6" title="Stroke smoothing"><span class="sep"></span><button id="snap" class="on" title="Hold still after drawing to perfect a shape">Snap</button><button id="po" title="Pen only: finger scrolls">Pen only</button>
    <span class="sep"></span><button id="undo">↶</button><button id="redo">↷</button>
    <span class="sep"></span><button id="zo">−</button><span id="zl" style="min-width:36px;text-align:center;font-size:12px">100%</span><button id="zi">＋</button>
    <span class="sep"></span><button id="clr">Clear</button>
  </div>
  <div id="selbar" hidden><button id="sdup">Duplicate</button><button id="sdl">Save PNG</button><button id="sdel">Delete</button></div>
  <div id="ied" hidden><b style="font:600 13px Inter">Image</b>
    <div class="ir"><button id="icrop">Crop</button><button id="irot" title="Rotate 90°">↻ Rotate</button><button id="iflp" title="Flip">⇋ Flip</button><button id="ibw">B&amp;W</button><button id="irst">Reset</button></div>
    <label>Brightness<input type="range" id="ibr" min="40" max="160" value="100"></label><label>Contrast<input type="range" id="ict" min="40" max="160" value="100"></label><label>Opacity<input type="range" id="iop" min="20" max="100" value="100"></label>
    <div class="ir" id="icr" hidden><button class="pri" id="iok">Apply crop</button><button id="ino">Cancel</button></div>
    <button id="idl">⬇ Download image</button></div>
  <div id="pop" hidden><div id="wheel"><i id="dk"></i><i id="knob"></i></div><input type="range" id="bri" min="15" max="100" value="90" title="Brightness"><div id="rec"></div><span id="hex">#1f2430</span></div>
  <div id="stage"><div id="sheet"><canvas id="cv"></canvas></div><textarea id="tx" placeholder="Start writing…"></textarea>
    <div id="empty"><h2>No notebooks yet</h2>Create one to start writing.</div></div>
</main>
</div>
<dialog id="dlg"><h3>Google Drive sync</h3>
  <p>Each notebook saves to an “Inkwell” folder in your Drive moments after every change. Paste your Google OAuth Web client ID (Drive API on, your site as an authorized origin).</p>
  <input id="cid" placeholder="123456-abc.apps.googleusercontent.com">
  <div style="display:flex;gap:8px;justify-content:flex-end"><button id="dx">Close</button><button class="pri" id="dgo">Connect</button></div></dialog>
<div id="toast"></div>
<script>
const $=s=>document.getElementById(s),cv=$('cv'),cx=cv.getContext('2d',{desynchronized:true}),st$=$('stage'),SH={ln:1,rc:1,el:1},BB=new WeakMap(),UD={};
const COLS=['#1f2430','#1e3a8a','#b91c1c','#166534','#b7791f','#7c3aed'],COVERS=['#7c4a2a','#1e3a5f','#5b2333','#2d5a45','#3a3a44','#8a6a1f','#5b3a7a'];
let nbs=[],cb=null,ci=0,tool='pen',color=COLS[0],size=3,db=null,tok=null,tc=null,folder=null,onTok=()=>{},t1,t2,tm,sc=1,zoom=1,vw=0,vh=0,raf=0,dr=null,snap=null,chg=false;
const dpr=Math.min(devicePixelRatio||1,2),cp=()=>cb&&cb.pages[ci],uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const msg=t=>{const e=$('toast');e.textContent=t;e.classList.add('s');clearTimeout(tm);tm=setTimeout(()=>e.classList.remove('s'),3200)};
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('inkwell',1);r.onupgradeneeded=()=>r.result.createObjectStore('n',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=rej});
const tx_=(m,f)=>new Promise(r=>{if(!db)return r([]);try{const t=db.transaction('n',m),q=f(t.objectStore('n'));t.oncomplete=()=>r(q&&q.result);t.onerror=()=>r([])}catch(e){r([])}});
const put=n=>tx_('readwrite',s=>s.put(n)),rm=id=>tx_('readwrite',s=>s.delete(id)),all=()=>tx_('readonly',s=>s.getAll());
function touch(){const n=cb;n.updated=Date.now();$('st').textContent='Saving…';clearTimeout(t1);t1=setTimeout(async()=>{await put(n);$('st').textContent=tok?'Saved · syncing':'Saved';list();thumb(cp())},500);clearTimeout(t2);if(tok)t2=setTimeout(()=>push(n),1500)}
/* rendering */
function paper(c,p,y0,y1){c.lineWidth=1;c.strokeStyle=c.fillStyle='#ddd5c5';const a=Math.floor(y0/36)*36,k=p.paper;
 if(k=='lined'){for(let y=Math.max(a,72);y<=y1;y+=36){c.beginPath();c.moveTo(0,y);c.lineTo(1000,y);c.stroke()}c.strokeStyle='#e8b4b0';c.beginPath();c.moveTo(90,y0);c.lineTo(90,y1);c.stroke()}
 if(k=='grid'){for(let y=a;y<=y1;y+=36){c.beginPath();c.moveTo(0,y);c.lineTo(1000,y);c.stroke()}for(let x=0;x<=1000;x+=36){c.beginPath();c.moveTo(x,y0);c.lineTo(x,y1);c.stroke()}}
 if(k=='dots'){for(let y=Math.max(a,36);y<=y1;y+=36)for(let x=36;x<1000;x+=36)c.fillRect(x-1,y-1,2,2)}}
function stroke(c,s){c.lineCap=c.lineJoin='round';c.strokeStyle=c.fillStyle=s.c;const p=s.p;if(s.t=='img'){const i=img(s.src);if(i.complete&&i.naturalWidth){fx(c,s.fl);c.drawImage(i,p[0][0],p[0][1],p[1][0]-p[0][0],p[1][1]-p[0][1]);c.filter='none';c.globalAlpha=1}return}
 if(SH[s.t]||s.t=='pg'){const a=p[0],b=p[p.length-1];c.lineWidth=s.w;c.beginPath();if(s.t=='pg'){p.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.closePath()}else if(s.t=='ln'){c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1])}else if(s.t=='rc')c.rect(a[0],a[1],b[0]-a[0],b[1]-a[1]);else c.ellipse((a[0]+b[0])/2,(a[1]+b[1])/2,Math.abs(b[0]-a[0])/2,Math.abs(b[1]-a[1])/2,0,0,7);c.stroke();return}
 if(s.t=='hi'){c.globalAlpha=.3;c.lineCap='butt';c.lineWidth=s.w*5;c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length-1;i++)c.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2);const e=p[p.length-1];c.lineTo(p.length==1?e[0]+.1:e[0],e[1]);c.stroke();c.globalAlpha=1;return}
 const w=q=>s.w*(.55+q[2]*.9);
 if(p.length==1){c.beginPath();c.arc(p[0][0],p[0][1],w(p[0])/2,0,7);c.fill();return}
 const n=p.length,m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];let a=m(p[0],p[1]);
 c.lineWidth=w(p[0]);c.beginPath();c.moveTo(p[0][0],p[0][1]);c.lineTo(a[0],a[1]);c.stroke();
 for(let i=1;i<n-1;i++){a=m(p[i-1],p[i]);const b=m(p[i],p[i+1]);c.lineWidth=w(p[i]);c.beginPath();c.moveTo(a[0],a[1]);c.quadraticCurveTo(p[i][0],p[i][1],b[0],b[1]);c.stroke()}
 a=m(p[n-2],p[n-1]);c.lineWidth=w(p[n-1]);c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(p[n-1][0],p[n-1][1]);c.stroke()}
function bb(s){let b=BB.get(s);if(!b){let a=1e9,z=-1e9;s.p.forEach(q=>{a=Math.min(a,q[1]);z=Math.max(z,q[1])});b=[a-s.w*5-2,z+s.w*5+2];BB.set(s,b)}return b}
function render(c,p,y0,s,w,h,d){c.setTransform(d,0,0,d,0,0);c.globalAlpha=1;c.fillStyle='#fdfbf6';c.fillRect(0,0,w,h);c.setTransform(d*s,0,0,d*s,0,-y0*s*d);const y1=y0+h/s;paper(c,p,y0,y1);
 p.strokes.forEach(t=>{const b=bb(t);if(b[1]>=y0&&b[0]<=y1)stroke(c,t)})}
const y0=()=>st$.scrollTop/sc;
function draw(){const p=cp();if(p&&p.type=='ink'){render(cx,p,y0(),sc,vw,vh,dpr);ovl()}}
function sched(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})}
function grow(){const p=cp();if(p&&p.type=='ink'&&y0()+vh/sc>p.h-700){p.h+=1500;$('sheet').style.height=Math.max(p.h*sc,vh)+'px'}}
function layout(){const p=cp();if(!p||p.type!='ink')return;const w=Math.max(280,Math.min(st$.clientWidth-32,900)*zoom);sc=w/1000;vw=w;vh=st$.clientHeight;
 cv.style.width=w+'px';cv.style.height=vh+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(vh*dpr);$('sheet').style.width=w+'px';$('zl').textContent=Math.round(zoom*100)+'%';grow();$('sheet').style.height=Math.max(p.h*sc,vh)+'px';draw()}
st$.onscroll=()=>{grow();sched()};addEventListener('resize',()=>layout());
/* input */
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/sc,(e.clientY-r.top)/sc+y0(),e.pressure||.5]};
